spring:
  application:
    name: lp2_gp2
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@localhost:1522/XE}
    username: ${DB_USERNAME:LP2}
    password: ${DB_PASSWORD:admin123}
    driver-class-name: oracle.jdbc.OracleDriver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  jackson:
    deserialization:
      accept-float-as-int: false

  # Correo (boleta informativa). Con Gmail usa una "contraseña de aplicación".
  # Las credenciales se leen de variables de entorno para no subirlas a GitHub.
  # Si MAIL_USERNAME está vacío, el envío queda desactivado (la vista previa sí funciona).
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  servlet:
    context-path: /lp2_gp2
  port: 8082

storage:
  location: "images"

kampu:
  # Datos de contacto de la agencia que muestra la página principal (GET /api/v1/contacto).
  # Las redes son opcionales: si se dejan vacías, no aparece su botón.
  contacto:
    email: ${KAMPU_CONTACTO_EMAIL:reservas@kampu.pe}
    telefono: ${KAMPU_CONTACTO_TELEFONO:+51 984 000 000}
    ciudad: ${KAMPU_CONTACTO_CIUDAD:Cusco, Perú}
    instagram: ${KAMPU_CONTACTO_INSTAGRAM:}
    facebook: ${KAMPU_CONTACTO_FACEBOOK:}
