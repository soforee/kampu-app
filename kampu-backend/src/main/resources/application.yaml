spring:
  application:
    name: kampu
  # Base de datos: kampu-backend/src/main/resources/db/kampu_bd.sql (ejecutar como SYSTEM en XEPDB1).
  # El script crea (o conserva) el usuario KAMPU_BD, dueño de las tablas, y el backend se conecta con él.
  # Roles de la aplicación: ADMIN, CLIENTE, VENTAS, GUIA y CONDUCTOR.
  # Sesión firmada: define KAMPU_SESION_SECRETO (32+ caracteres) en producción; sin ella se genera
  # una clave al arrancar y las sesiones se cierran en cada reinicio.
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@localhost:1521/XEPDB1}
    username: ${DB_USERNAME:KAMPU_BD}
    password: ${DB_PASSWORD:Kampu_Bd_2026}
    driver-class-name: oracle.jdbc.OracleDriver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect

  jackson:
    deserialization:
      accept-float-as-int: false

  # Correo (boleta informativa). Con Gmail usa una "contraseña de aplicación".
  # Las credenciales se leen de variables de entorno para no subirlas a GitHub.
  # Si MAIL_USERNAME está vacío, el envío queda desactivado (la vista previa sí funciona).
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  servlet:
    context-path: /kampu
  port: 8082

storage:
  location: "images"

