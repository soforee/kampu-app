spring:
  application:
    name: lp2_gp2
  # Base de datos: kampu-backend/src/main/resources/db/kampu_tours_v11.sql (ejecutar como SYSTEM en XEPDB1).
  # El script crea (o conserva) el dueño KAMPU_BD y el usuario de conexión KAMPU_APP, que recibe
  # los roles ROL_ADMIN, ROL_VENTAS, ROL_OPERADOR, ROL_CLIENTE y ROL_CAMPO (personal, portal y guías/conductores).
  # Base v10 con datos: db/migracion_v10_a_v11.sql. Sesión firmada: define KAMPU_SESION_SECRETO (32+ caracteres)
  # en producción; sin ella se genera una clave al arrancar y las sesiones se cierran en cada reinicio.
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@localhost:1521/XEPDB1}
    username: ${DB_USERNAME:KAMPU_APP}
    password: ${DB_PASSWORD:Kampu_App_2026}
    driver-class-name: oracle.jdbc.OracleDriver
    # Las tablas viven en el esquema KAMPU_BD (variable DB_SCHEMA): SesionOracleDataSource lo fija en cada conexión

  jpa:
    open-in-view: false
    hibernate:
      # Las entidades se validan contra el esquema al arrancar (no se crea ni modifica nada)
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_schema: ${DB_SCHEMA:KAMPU_BD}

  jackson:
    deserialization:
      accept-float-as-int: false

  # Correo (boleta informativa). Con Gmail usa una "contraseña de aplicación".
  # Las credenciales se leen de variables de entorno para no subirlas a GitHub.
  # Si MAIL_USERNAME está vacío, el envío queda desactivado (la vista previa sí funciona).
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  servlet:
    context-path: /lp2_gp2
  port: 8082

storage:
  location: "images"

