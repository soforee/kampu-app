spring:
  application:
    name: lp2_gp2
  # Base de datos: kampu-backend/src/main/resources/db/kampu_tours_v10.sql (ejecutar como SYSTEM en XEPDB1).
  # El script crea el dueño KAMPU y dos usuarios de conexión:
  #   KAMPU_APP -> backend del personal interno (ROL_ADMIN, ROL_VENTAS, ROL_OPERADOR)
  #   KAMPU_WEB -> portal de clientes (ROL_CLIENTE), configurado en kampu.portal.datasource
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@localhost:1521/XEPDB1}
    username: ${DB_USERNAME:KAMPU_APP}
    password: ${DB_PASSWORD:Kampu_App_2026}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      pool-name: app-kampu
      # Consultas nativas, secuencias y PL/SQL sin prefijo de esquema
      connection-init-sql: ALTER SESSION SET CURRENT_SCHEMA=${DB_SCHEMA:KAMPU}

  jpa:
    open-in-view: false
    hibernate:
      # Las entidades se validan contra el esquema al arrancar (no se crea ni modifica nada)
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_schema: ${DB_SCHEMA:KAMPU}

  jackson:
    deserialization:
      accept-float-as-int: false

  # Correo (boleta informativa). Con Gmail usa una "contraseña de aplicación".
  # Las credenciales se leen de variables de entorno para no subirlas a GitHub.
  # Si MAIL_USERNAME está vacío, el envío queda desactivado (la vista previa sí funciona).
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  servlet:
    context-path: /lp2_gp2
  port: 8082

storage:
  location: "images"

kampu:
  # Datos de contacto de la agencia que muestra la página principal (GET /api/v1/contacto).
  # Las redes son opcionales: si se dejan vacías, no aparece su botón.
  contacto:
    email: ${KAMPU_CONTACTO_EMAIL:reservas@kampu.pe}
    telefono: ${KAMPU_CONTACTO_TELEFONO:+51 984 000 000}
    ciudad: ${KAMPU_CONTACTO_CIUDAD:Cusco, Perú}
    instagram: ${KAMPU_CONTACTO_INSTAGRAM:}
    facebook: ${KAMPU_CONTACTO_FACEBOOK:}
  # Conexión del portal de clientes (KAMPU_WEB, solo ROL_CLIENTE)
  portal:
    datasource:
      url: ${DB_URL:jdbc:oracle:thin:@localhost:1521/XEPDB1}
      username: ${DB_WEB_USERNAME:KAMPU_WEB}
      password: ${DB_WEB_PASSWORD:Kampu_Web_2026}
      driver-class-name: oracle.jdbc.OracleDriver
      hikari:
        maximum-pool-size: 5
        connection-init-sql: ALTER SESSION SET CURRENT_SCHEMA=${DB_SCHEMA:KAMPU}
