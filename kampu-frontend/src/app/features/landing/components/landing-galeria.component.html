<section id="galeria" class="pantalla diapo-oscura !p-0" style="background: var(--kp-dark)">
  <div class="mosaico flex-1">
    <div class="flex flex-col justify-end px-6 pb-10 pt-28 sm:px-10 lg:pb-12">
      <div appRevelar data-entra style="--i: 0">
        <p class="diapo-num"><b>05</b><span>Galería</span></p>
        <h2 class="diapo-titulo">Paisajes que te esperan.</h2>
        <p class="mt-5 max-w-xs text-[15px] leading-relaxed text-white/65">Algunos de los lugares que recorren nuestros tours.</p>
      </div>
    </div>

    @for (f of fotos; track f.clave; let i = $index) {
      <figure class="foto" [attr.data-foto]="i % 2 === 0 ? 'der' : 'izq'" [style.animation-delay.ms]="i * 70">
        <img [src]="f.src" [alt]="f.lugar + ', ' + f.region" loading="lazy">
        <figcaption>
          <span class="block text-sm font-semibold">{{ f.lugar }}</span>
          <span class="block text-xs opacity-80">{{ f.region }}</span>
          <a [href]="f.fuente" target="_blank" rel="noopener" class="credito mt-1 block text-[10px] hover:underline">Foto: {{ f.autor }} · {{ f.licencia }}</a>
        </figcaption>
      </figure>
    }
  </div>
</section>
