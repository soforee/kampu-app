<!-- Cómo funciona: los 4 pasos reales de un cliente, con números grandes como en una pieza editorial -->
<section id="como-funciona" class="pantalla" style="background: var(--kp-bg-alt)">
  <div class="mx-auto w-full max-w-6xl px-5 sm:px-8">
    <div class="max-w-2xl" appRevelar data-entra style="--i: 0">
      <p class="diapo-num"><b>04</b><span>Cómo funciona</span></p>
      <h2 class="diapo-titulo">De la idea al viaje, en cuatro pasos.</h2>
    </div>

    <ol class="mt-14 grid gap-x-8 gap-y-12 sm:grid-cols-2 lg:mt-20 lg:grid-cols-4">
      @for (p of pasos; track p.titulo; let i = $index) {
        <li class="paso" appRevelar [retraso]="i * 100" data-entra [style.--i]="i + 1">
          <span class="paso-num" aria-hidden="true">0{{ i + 1 }}</span>
          <div class="mt-6 flex items-center gap-3 border-t pt-5" style="border-color: var(--kp-border)">
            <span class="grid h-9 w-9 shrink-0 place-items-center rounded-full" style="background: var(--kp-primary-soft); color: var(--kp-primary)"><app-icon [name]="p.icono" size="w-[18px] h-[18px]" /></span>
            <h3 class="text-lg font-semibold tracking-tight" style="color: var(--kp-text)">{{ p.titulo }}</h3>
          </div>
          <p class="mt-3 text-[15px] leading-relaxed" style="color: var(--kp-muted)">{{ p.texto }}</p>
        </li>
      }
    </ol>

    <div class="mt-14 lg:mt-16" data-entra style="--i: 5">
      <a href="#tours" class="inline-flex items-center gap-2 text-sm font-semibold underline decoration-leaf-400 decoration-2 underline-offset-8 transition-colors hover:text-brand-700" style="color: var(--kp-primary)">
        Empieza eligiendo tu tour <app-icon name="arrow-right" size="w-4 h-4" />
      </a>
    </div>
  </div>
</section>
