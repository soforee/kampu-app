<section id="nosotros" class="pantalla diapo-oscura overflow-hidden !p-0" style="background: var(--kp-dark)">
  <div class="grid flex-1 lg:grid-cols-2">
    <figure class="relative min-h-[42vh] overflow-hidden lg:min-h-0" data-foto="izq">
      <img [src]="foto.src" [alt]="foto.lugar + ', ' + foto.region" loading="lazy" class="absolute inset-0 h-full w-full object-cover">
      <div class="absolute inset-0 bg-gradient-to-t from-black/45 via-transparent to-black/25"></div>
      <figcaption class="absolute bottom-6 left-6 right-6 flex items-end justify-between gap-4 text-white">
        <span class="inline-flex items-center gap-2 text-sm font-medium"><app-icon name="map-pin" size="w-4 h-4" /> {{ foto.lugar }}, {{ foto.region }}</span>
        <a [href]="foto.fuente" target="_blank" rel="noopener" class="text-[11px] text-white/55 hover:text-white/85">Foto: {{ foto.autor }} · {{ foto.licencia }}</a>
      </figcaption>
    </figure>

    <div class="flex items-center px-6 py-16 sm:px-12 lg:px-16 lg:pb-16 lg:pt-28 xl:px-20">
      <div class="max-w-lg" appRevelar>
        <div data-entra style="--i: 0">
          <p class="diapo-num"><b>03</b><span>Nosotros</span></p>
          <h2 class="diapo-titulo">Organizamos cada detalle de tu viaje.</h2>
        </div>
        <p class="mt-6 text-base leading-relaxed text-white/70" data-entra style="--i: 1">
          Programamos las salidas, asignamos guías y coordinamos cada traslado — del aeropuerto al hotel y del hotel a cada atractivo —
          para que tu única tarea sea disfrutar.
        </p>
        <dl class="mt-12 grid grid-cols-3 gap-6 border-t border-white/10 pt-8" data-entra style="--i: 2">
          <div class="flex flex-col-reverse">
            <dt class="mt-2 text-sm text-white/60">Tours activos</dt>
            <dd class="text-5xl font-semibold tracking-tight tabular-nums text-leaf-400 xl:text-6xl">{{ tours }}</dd>
          </div>
          <div class="flex flex-col-reverse">
            <dt class="mt-2 text-sm text-white/60">Salidas abiertas</dt>
            <dd class="text-5xl font-semibold tracking-tight tabular-nums text-leaf-400 xl:text-6xl">{{ salidas }}</dd>
          </div>
          <div class="flex flex-col-reverse">
            <dt class="mt-2 text-sm text-white/60">Cupos libres</dt>
            <dd class="text-5xl font-semibold tracking-tight tabular-nums text-leaf-400 xl:text-6xl">{{ cupos }}</dd>
          </div>
        </dl>
      </div>
    </div>
  </div>
</section>
