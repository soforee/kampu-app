<section id="beneficios" class="pantalla bg-white">
  <div class="mx-auto w-full max-w-6xl px-5 sm:px-8">
    <div class="grid gap-12 lg:grid-cols-[1fr_1.6fr] lg:gap-16">
      <div appRevelar>
        <p class="seccion-etiqueta">Por qué elegirnos</p>
        <h2 class="seccion-titulo">Viajar con nosotros es simple.</h2>
        <p class="mt-4 max-w-sm text-[15px] leading-relaxed" style="color: var(--kp-muted)">Nos encargamos de la organización para que tú solo pienses en disfrutar.</p>
      </div>
      <div class="grid gap-4 sm:grid-cols-2">
        @for (b of beneficios; track b.titulo; let i = $index) {
          <div class="beneficio" appRevelar [retraso]="i * 80">
            <span class="beneficio-icono"><app-icon [name]="b.icono" size="w-5 h-5" /></span>
            <div>
              <h3 class="text-base font-semibold tracking-tight" style="color: var(--kp-text)">{{ b.titulo }}</h3>
              <p class="mt-1 text-sm leading-relaxed" style="color: var(--kp-muted)">{{ b.texto }}</p>
            </div>
          </div>
        }
      </div>
    </div>
  </div>
</section>
