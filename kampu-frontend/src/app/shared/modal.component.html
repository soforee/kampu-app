<div class="fixed inset-0 z-[60] flex items-end justify-center p-0 sm:items-center sm:p-6" role="dialog" aria-modal="true" [attr.aria-labelledby]="idTitulo">
  <div class="absolute inset-0 bg-zinc-900/30 animate-fade-in" (click)="cerrar.emit()"></div>
  <div data-panel tabindex="-1" class="relative flex max-h-[92vh] w-full flex-col overflow-hidden rounded-t-2xl border border-zinc-200 bg-white shadow-modal outline-none animate-pop-in sm:max-w-xl sm:rounded-xl">
    <div class="flex items-center justify-between gap-4 border-b border-zinc-100 px-6 py-4">
      <h3 [id]="idTitulo" class="truncate text-base font-semibold text-zinc-900">{{ titulo }}</h3>
      <button type="button" data-cerrar class="icon-btn -mr-2 shrink-0" title="Cerrar (Esc)" aria-label="Cerrar" (click)="cerrar.emit()">
        <app-icon name="x" size="w-4 h-4" />
      </button>
    </div>
    <div class="overflow-y-auto p-6">
      <ng-content />
    </div>
  </div>
</div>
